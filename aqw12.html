<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Privado da Turma</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; justify-content: center; }
  .caixa { background: white; width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; }
  .topo { background: #0066ff; color: white; padding: 15px; text-align: center; }
  input, button { padding: 12px; border-radius: 6px; }
  input { border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
  button { background: #0066ff; color: white; border: none; cursor: pointer; }
  /* LISTA */
  .usuario { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
  .usuario b { font-size: 14px; display: block; word-break: break-all; }
  .usuario small { color: #888; }
  .btn-conversar { background: #28a745; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  /* CHAT */
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #e5ddd5; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: white; font-size: 14px; }
  .msg.minha { background: #dcf8c6; align-self: flex-end; }
  .msg span { font-size: 10px; color: #888; display: block; text-align: right; }
  .enviar { display: flex; padding: 10px; gap: 8px; background: white; }
  .enviar input { flex: 1; border-radius: 20px; }
  .enviar button { border-radius: 50%; font-size: 20px; padding: 0 16px; }
</style>
  <!-- PWA - Virar Aplicativo - COPIADO DO 1º CÓDIGO -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0066ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat Turma">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
</head>
<body>

<!-- 1. LOGIN -->
<div id="tela-login" class="caixa" style="height:auto; margin-top:40px; padding:25px; box-sizing:border-box;">
  <h2 style="text-align:center">Entrar no Chat</h2>
  <input type="email" id="email" placeholder="Seu e-mail"><br><br>
  <input type="password" id="senha" placeholder="Sua senha"><br><br>
  <button id="btn-entrar" style="width:100%">Entrar</button>
  <p id="msg-erro" style="color:red; font-size:13px; text-align:center"></p>
</div>

<!-- 2. LISTA DE PESSOAS -->
<div id="tela-lista" class="caixa" style="display:none;">
  <div class="topo">
    <b>Conversas 💬</b><br>
    <small id="meu-email"></small> | <span id="btn-sair" style="cursor:pointer; text-decoration:underline">Sair</span>
  </div>
  <p style="padding:0 15px; color:#555; font-size:14px;">Escolha uma pessoa para conversar:</p>
  <div id="lista-usuarios"></div>
</div>

<!-- 3. CHAT PRIVADO -->
<div id="tela-chat" class="caixa" style="display:none;">
  <h1>estive aqui</h1>
  <div class="topo" style="display:flex; justify-content:space-between; align-items:center;">
    <span id="btn-voltar" style="cursor:pointer;">← Voltar</span>
    <b id="nome-conversa" style="font-size:14px;">Conversando...</b>
    <span></span>
  </div>
  <div id="chat"></div>
  <div class="enviar">
    <input type="text" id="campo-msg" placeholder="Digite...">
    <button id="btn-enviar">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBG56QSXGiSmQa__JVk-lY8ZUtKIB7IuBE",
  authDomain: "banco1-1e33c.firebaseapp.com",
  projectId: "banco1-1e33c",
  storageBucket: "banco1-1e33c.firebasestorage.app",
  messagingSenderId: "680346350396",
  appId: "1:680346350396:web:a276be7266aec99c8aa439"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let idConversaAtual = null;
let pararOuvir = null; // pra parar de ouvir a conversa antiga

// LOGIN
document.getElementById('btn-entrar').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  try { await signInWithEmailAndPassword(auth, email, senha); }
  catch(e){ document.getElementById('msg-erro').textContent = "Erro: " + e.code; }
};
document.getElementById('btn-sair').onclick = () => signOut(auth);

// QUANDO LOGAR
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('tela-lista').style.display = 'flex';
    document.getElementById('tela-chat').style.display = 'none';
    document.getElementById('meu-email').textContent = user.email;

    // 1. SALVA O USUÁRIO NA LISTA (pra aparecer pros outros)
    await setDoc(doc(db, "usuarios", user.uid), {
      email: user.email,
      uid: user.uid
    });

    // 2. CARREGA A LISTA
    carregarUsuarios();
  } else {
    document.getElementById('tela-login').style.display = 'block';
    document.getElementById('tela-lista').style.display = 'none';
    document.getElementById('tela-chat').style.display = 'none';
  }
});

// MOSTRA A LISTA COM BOTÃO CONVERSAR
async function carregarUsuarios() {
  const snap = await getDocs(collection(db, "usuarios"));
  const lista = document.getElementById('lista-usuarios');
  lista.innerHTML = "";
  snap.forEach(d => {
    const u = d.data();
    if (u.uid === auth.currentUser.uid) return; // não mostra ele mesmo

    const div = document.createElement('div');
    div.className = 'usuario';
    div.innerHTML = `<div><b>${u.email}</b><small>Online</small></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn-conversar';
    btn.textContent = 'Conversar';
    btn.onclick = () => abrirConversa(u.uid, u.email);
    div.appendChild(btn);
    lista.appendChild(div);
  });
  if (lista.innerHTML === "") lista.innerHTML = "<p style='padding:15px'>Nenhum outro aluno logou ainda. Peça pra outro aluno entrar.</p>";
}

// ABRE A CONVERSA PRIVADA
function abrirConversa(outroUid, outroEmail) {
  document.getElementById('tela-lista').style.display = 'none';
  document.getElementById('tela-chat').style.display = 'flex';
  document.getElementById('nome-conversa').textContent = outroEmail;

  // Cria o código da salinha - sempre igual pros 2
  let ids = [auth.currentUser.uid, outroUid].sort();
  idConversaAtual = ids[0] + "_" + ids[1];

  // Para de ouvir a conversa antiga
  if (pararOuvir) pararOuvir();

  const q = query(collection(db, "conversas", idConversaAtual, "mensagens"), orderBy("data", "asc"));
  const chatDiv = document.getElementById('chat');
  pararOuvir = onSnapshot(q, (snap) => {
    chatDiv.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const div = document.createElement('div');
      div.className = 'msg' + (d.enviadoPor === auth.currentUser.email ? ' minha' : '');
      const hora = d.data ? d.data.toDate().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
      div.innerHTML = `${d.texto}<span>${hora}</span>`;
      chatDiv.appendChild(div);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
  });
}

// VOLTAR PRA LISTA
document.getElementById('btn-voltar').onclick = () => {
  document.getElementById('tela-chat').style.display = 'none';
  document.getElementById('tela-lista').style.display = 'flex';
  if (pararOuvir) pararOuvir();
  carregarUsuarios(); // atualiza a lista
};

// ENVIAR
async function enviar() {
  const input = document.getElementById('campo-msg');
  const texto = input.value.trim();
  if (!texto || !idConversaAtual) return;
  input.value = "";
  await addDoc(collection(db, "conversas", idConversaAtual, "mensagens"), {
    texto: texto,
    enviadoPor: auth.currentUser.email,
    enviadoPorUid: auth.currentUser.uid,
    data: serverTimestamp()
  });
}
document.getElementById('btn-enviar').onclick = enviar;
document.getElementById('campo-msg').addEventListener('keydown', e => { if(e.key === 'Enter') enviar(); });
</script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
