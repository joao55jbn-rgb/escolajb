<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador e Verificador de Usuários (TXT)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #e4e6eb;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #65676b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #1877f2;
      border-bottom-color: #1877f2;
    }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #1877f2; }
    
    .btn {
      width: 100%;
      padding: 12px;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-blue { background-color: #1877f2; }
    .btn-blue:hover { background-color: #166fe5; }
    .btn-green { background-color: #28a745; }
    .btn-green:hover { background-color: #218838; }
    .btn-dark { background-color: #343a40; margin-top: 10px; }
    .btn-dark:hover { background-color: #23272b; }

    .alerta {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      word-break: break-word;
    }
    .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .txt-area-box {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #ccc;
    }
    .txt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      background-color: #f8f9fa;
      resize: vertical;
    }
    .file-upload {
      margin-bottom: 15px;
      padding: 10px;
      background: #f8f9fa;
      border: 1px dashed #adb5bd;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="mudarAba('adicionar')">1. Adicionar Usuário</button>
      <button class="tab-btn" onclick="mudarAba('verificar')">2. Verificar Login</button>
    </div>

    <!-- ABA 1: ADICIONAR USUÁRIO -->
    <div id="aba-adicionar" class="form-section active">
      <form id="formAdicionar">
        <div class="form-group">
          <label for="addUsuario">Nome de Usuário:</label>
          <input type="text" id="addUsuario" placeholder="Ex: João" required>
        </div>
        <div class="form-group">
          <label for="addSenha">Senha:</label>
          <input type="password" id="addSenha" placeholder="Ex: Hsu29@dk" required>
        </div>
        <button type="submit" class="btn btn-green">+ Adicionar à Lista</button>
      </form>
      <div id="msgAdicionar" class="alerta"></div>
    </div>

    <!-- ABA 2: VERIFICAR LOGIN -->
    <div id="aba-verificar" class="form-section">
      <div class="file-upload">
        <label for="importarTxt" style="margin-bottom: 4px;">Opcional: Carregar arquivo <code>usuarios.txt</code> existente:</label>
        <input type="file" id="importarTxt" accept=".txt" style="padding: 4px; font-size: 13px;">
      </div>

      <form id="formVerificar">
        <div class="form-group">
          <label for="verUsuario">Usuário:</label>
          <input type="text" id="verUsuario" placeholder="Digite o usuário para testar" required>
        </div>
        <div class="form-group">
          <label for="verSenha">Senha:</label>
          <input type="password" id="verSenha" placeholder="Digite a senha para testar" required>
        </div>
        <button type="submit" class="btn btn-blue">Verificar Acesso</button>
      </form>
      <div id="msgVerificar" class="alerta"></div>
    </div>

    <!-- ÁREA DO ARQUIVO TXT (SINCRONIZADA COM AMBAS AS ABAS) -->
    <div class="txt-area-box">
      <div class="txt-header">
        <strong>Conteúdo do <code>usuarios.txt</code> (<span id="contador">0</span> usuários):</strong>
        <button type="button" onclick="limparLista()" style="background:none; border:none; color:#d93025; cursor:pointer; font-size:12px; text-decoration:underline;">Limpar tudo</button>
      </div>
      <textarea id="conteudoTxt" placeholder="Os usuários adicionados aparecerão aqui no formato usuario:hash (você também pode colar linhas manualmente aqui)."></textarea>
      <button type="button" class="btn btn-dark" onclick="baixarTxt()">Baixar arquivo usuarios.txt</button>
    </div>
  </div>

  <script>
    const textarea = document.getElementById("conteudoTxt");
    const contador = document.getElementById("contador");

    // Atualiza a contagem de linhas válidas sempre que o texto mudar
    textarea.addEventListener("input", atualizarContador);

    function atualizarContador() {
      const linhas = textarea.value.split(/\r?\n/).filter(l => l.includes(":"));
      contador.textContent = linhas.length;
    }

    // Criptografia PBKDF2 (idêntica à do GitHub Pages)
    async function gerarHashSeguro(usuario, senha) {
      const encoder = new TextEncoder();
      const chaveBase = await crypto.subtle.importKey(
        "raw",
        encoder.encode(senha),
        { name: "PBKDF2" },
        false,
        ["deriveBits"]
      );

      const salt = encoder.encode("sistema_auth_" + usuario.trim().toLowerCase());

      const bitsDerivados = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        chaveBase,
        256
      );

      const arrayBytes = Array.from(new Uint8Array(bitsDerivados));
      return arrayBytes.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // 1. Adicionar Usuário à lista TXT
    document.getElementById("formAdicionar").addEventListener("submit", async function(e) {
      e.preventDefault();
      const usuario = document.getElementById("addUsuario").value.trim().toLowerCase();
      const senha = document.getElementById("addSenha").value;
      const msg = document.getElementById("msgAdicionar");

      if (usuario.includes(":")) {
        mostrarAlerta(msg, "O nome de usuário não pode conter dois-pontos (:).", "erro");
        return;
      }

      // Verifica se o usuário já existe na lista
      const linhasAtuais = textarea.value.split(/\r?\n/);
      const jaExiste = linhasAtuais.some(linha => linha.split(":")[0]?.trim().toLowerCase() === usuario);

      if (jaExiste) {
        mostrarAlerta(msg, `O usuário "${usuario}" já está na lista abaixo.`, "erro");
        return;
      }

      const hash = await gerarHashSeguro(usuario, senha);
      const novaLinha = `${usuario}:${hash}`;

      // Adiciona ao textarea
      textarea.value = textarea.value.trim() 
        ? textarea.value.trim() + "\n" + novaLinha 
        : novaLinha;

      atualizarContador();
      mostrarAlerta(msg, `Usuário "${usuario}" adicionado! Clique no botão preto abaixo quando quiser baixar o .txt atualizado.`, "sucesso");
      this.reset();
    });

    // 2. Verificar Login contra a lista TXT
    document.getElementById("formVerificar").addEventListener("submit", async function(e) {
      e.preventDefault();
      const usuarioDigitado = document.getElementById("verUsuario").value.trim().toLowerCase();
      const senhaDigitada = document.getElementById("verSenha").value;
      const msg = document.getElementById("msgVerificar");

      const textoArquivo = textarea.value.trim();
      if (!textoArquivo) {
        mostrarAlerta(msg, "A lista de usuários está vazia. Adicione um usuário ou carregue um arquivo .txt.", "erro");
        return;
      }

      const hashDigitado = await gerarHashSeguro(usuarioDigitado, senhaDigitada);
      const linhas = textoArquivo.split(/\r?\n/);
      let autorizado = false;

      for (const linha of linhas) {
        if (!linha.trim()) continue;
        const [usuarioSalvo, hashSalvo] = linha.split(":");

        if (
          usuarioSalvo &&
          hashSalvo &&
          usuarioSalvo.trim().toLowerCase() === usuarioDigitado &&
          hashSalvo.trim() === hashDigitado
        ) {
          autorizado = true;
          break;
        }
      }

      if (autorizado) {
        mostrarAlerta(msg, `Acesso autorizado para "${usuarioDigitado}"! O hash coincide com o registro do TXT.`, "sucesso");
      } else {
        mostrarAlerta(msg, "Acesso negado: usuário ou senha incorretos.", "erro");
      }
    });

    // Importar arquivo .txt do computador
    document.getElementById("importarTxt").addEventListener("change", function(e) {
      const arquivo = e.target.files[0];
      if (!arquivo) return;

      const leitor = new FileReader();
      leitor.onload = function(evento) {
