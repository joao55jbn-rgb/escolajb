<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Palavra - Acesso Restrito</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 40px; background: #f0f2f5; }
    .caixa { background: white; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; color: #333; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 4px; }
    input { border: 1px solid #ccc; }
    button { background: #0066ff; color: white; border: none; font-size: 16px; cursor: pointer; }
    .btn-sair { background: #dc3545; margin-top: 20px; }
    .msg { font-size: 13px; text-align: center; margin-top: 10px; word-break: break-word; }
  </style>
</head>
<body>

  <!-- TELA 1: LOGIN -->
  <div id="tela-login" class="caixa">
    <h2>LoginJB Restrito</h2>
    <input type="email" id="email" placeholder="E-mail cadastrado">
    <input type="password" id="senha" placeholder="Senha">
    <button id="btn-entrar">Entrar</button>
    <p id="msg-erro" class="msg" style="color: red;"></p>
  </div>

  <!-- TELA 2: ÁREA LOGADA -->
  <div id="tela-logado" class="caixa" style="display: none;">
    <h2>Enviar Palavra</h2>
    <p style="font-size: 14px; color: #555;">Logado como: <strong id="user-email"></strong></p>
    
    <input type="text" id="campo-palavra" placeholder="Digite uma palavra aqui...">
    <button id="btn-enviar" style="background: #28a745;">Salvar no Banco</button>
    <p id="msg-status" class="msg"></p>

    <button id="btn-sair" class="btn-sair">Sair</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
      from "https://gstatic.com";
    import { getFirestore, collection, addDoc } 
      from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBG56QSXGiSmQa__JVk-lY8ZUtKIB7IuBE",
      authDomain: "://firebaseapp.com",
      projectId: "banco1-1e33c",
      storageBucket: "banco1-1e33c.firebasestorage.app",
      messagingSenderId: "680346350396",
      appId: "1:680346350396:web:a276be7266aec99c8aa439"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('tela-logado').style.display = 'block';
        document.getElementById('user-email').textContent = user.email;
      } else {
        document.getElementById('tela-login').style.display = 'block';
        document.getElementById('tela-logado').style.display = 'none';
      }
    });

    // FAZER LOGIN (Mostrando o código real do erro)
    document.getElementById('btn-entrar').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const msgErro = document.getElementById('msg-erro');
      msgErro.textContent = "Conectando...";

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        msgErro.textContent = "";
      } catch (error) {
        msgErro.textContent = "Falha: " + error.code;
      }
    };

    // ENVIAR PALAVRA (Mostrando o código real do erro)
    document.getElementById('btn-enviar').onclick = async () => {
      const inputPalavra = document.getElementById('campo-palavra');
      const palavra = inputPalavra.value.trim();
      const msgStatus = document.getElementById('msg-status');

      if (!palavra) {
        msgStatus.style.color = "red";
        msgStatus.textContent = "Digite uma palavra antes de enviar.";
        return;
      }

      msgStatus.style.color = "blue";
      msgStatus.textContent = "Enviando...";

      try {
        await addDoc(collection(db, "palavras"), {
          texto: palavra,
          enviadoPor: auth.currentUser.email,
          data: new Date().toISOString()
        });

        msgStatus.style.color = "green";
        msgStatus.textContent = "Palavra salva com sucesso!";
        inputPalavra.value = "";
      } catch (error) {
        msgStatus.style.color = "red";
        msgStatus.textContent = "Erro no banco: " + error.code;
      }
    };

    document.getElementById('btn-sair').onclick = () => signOut(auth);
  </script>
</body>
</html>
