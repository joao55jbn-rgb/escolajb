<script>
const carrossel = document.querySelector('.carrossel');
const imagens = document.querySelector('.imagens');
const botoes = document.querySelector('.botoes');
const indicadores = document.querySelector('.indicadores');

let indiceAtual = 0;
const totalImagens = imagens.children.length;

function atualizarCarrossel() {
  imagens.style.transform = `translateX(-${indiceAtual * 100}%)`;
  indicadores.children[indiceAtual].classList.add('ativo');
  indicadores.children.forEach((indicador, i) => {
    if (i !== indiceAtual) {
      indicador.classList.remove('ativo');
    }
  });
}

botoes.children[0].addEventListener('click', () => {
  indiceAtual = (indiceAtual - 1 + totalImagens) % totalImagens;
  atualizarCarrossel();
});

botoes.children[1].addEventListener('click', () => {
  indiceAtual = (indiceAtual + 1) % totalImagens;
  atualizarCarrossel();
});

indicadores.children.forEach((indicador, i) => {
  indicador.addEventListener('click', () => {
    indiceAtual = i;
    atualizarCarrossel();
  });
});
</script>
